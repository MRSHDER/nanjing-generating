<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>南京 · 二维开场样片</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #191919; color: #eee9df; font-family: "Microsoft YaHei", sans-serif; }
    main { max-width: 1280px; margin: 36px auto; padding: 0 24px; }
    header { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
    h1 { font-size: 20px; font-weight: 500; margin: 0; }
    header span, footer { color: #aaa; font-size: 13px; }
    canvas { width: 100%; height: auto; display: block; aspect-ratio: 16 / 9; }
    nav { display: flex; align-items: center; gap: 16px; margin-top: 18px; flex-wrap: wrap; }
    button, select { background: #eee9df; color: #141414; padding: 10px 16px; border: 0; border-radius: 4px; font: inherit; cursor: pointer; }
    input { flex: 1; min-width: 160px; accent-color: #e2382b; }
    footer { margin-top: 16px; line-height: 1.8; }
    body.export main { max-width: none; margin: 0; padding: 0; }
    body.export header, body.export nav, body.export footer { display: none; }
  </style>
</head>
<body>
  <main>
    <header><h1>南京，正在生成 · 二维开场</h1><span>128 BPM / 7.5 秒 / 无声样片</span></header>
    <canvas id="overlay-preview" width="1920" height="1080"></canvas>
    <nav>
      <button id="play" type="button">播放</button>
      <input id="seek" aria-label="预览进度" type="range" min="0" max="7.5" step="0.0166666667" value="0">
      <output id="time">0.00 / 7.50 秒</output>
      <select id="theme" aria-label="预览底色"><option value="paper">浅底</option><option value="dark">深底</option></select>
      <select id="layer" aria-label="预览层"><option value="all">背景与前层</option><option value="behind">仅二维背景板</option><option value="front">仅前层信息</option></select>
    </nav>
    <footer>空格播放 / 暂停，方向键逐帧查看。这里展示二维层，三维和配乐尚未合成；底色仅供预览。</footer>
  </main>
  <script type="module" src="/src/overlay2d/preview.ts"></script>
</body>
</html>
